# Keep the existing HTTPS frontend and its bind/certificate directives.
# Point that frontend's default_backend (or matching use_backend) at ankah.
backend ankah
    mode http
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request set-header X-Forwarded-For %[src]
    # Host is preserved. Do not also enable option forwardfor.
    server gateway 127.0.0.1:8000
