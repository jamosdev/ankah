# Short intervals for a live demo; retention is only a few hours.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: edge
    static_configs:
      - targets: ["172.30.1.10:9100"]
  - job_name: anubis
    static_configs:
      - targets: ["anubis:9090"]
  - job_name: ankah
    authorization:
      type: Bearer
      credentials_file: /run/demo-certs/ankah-dashboard-token
    static_configs:
      - targets: ["172.30.1.21:9101"]
  - job_name: backends
    static_configs:
      - targets: ["fastapi:9102", "django:9102"]
  - job_name: attacker
    static_configs:
      - targets: ["172.30.0.20:9300"]
  - job_name: legit-probe
    static_configs:
      - targets: ["172.30.0.21:9301"]
  - job_name: cadvisor
    static_configs:
      - targets: ["172.30.2.30:8080"]
    metric_relabel_configs:
      # Keep only the container series the dashboard uses.
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total|spec_cpu_quota|spec_cpu_period|spec_memory_limit_bytes)
        action: keep
